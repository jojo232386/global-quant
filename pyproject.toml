[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gmaq-freqtrade-runtime"
version = "0.1.0"
description = "Thin GMAQ strategy and safety contract around Freqtrade"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = []
packages = ["gmaq_data", "control_room"]

[tool.pytest.ini_options]
testpaths = ["tests"]
