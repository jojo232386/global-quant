name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned test and OSS PoC dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r research/oss/requirements-vectorbt-poc.txt
      - name: Validate tracked diff
        run: git diff --check
      - name: Run contract suite
        run: python -m pytest -q
      - name: Check executable syntax
        run: |
          bash -n scripts/gmaq scripts/reliability-soak
          for script in scripts/*; do
            [ -f "$script" ] || continue
            if head -n 1 "$script" | grep -q python; then
              python -m py_compile "$script"
            fi
          done
