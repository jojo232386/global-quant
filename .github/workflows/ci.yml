name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Validate tracked diff
        run: git diff --check
      - name: Run contract suite
        run: python -m pytest -q
      - name: Check executable syntax
        run: |
          bash -n scripts/gmaq scripts/reliability-soak
          python -m py_compile \
            scripts/gmaq-control \
            scripts/gmaq-control-room \
            scripts/gmaq-fetch-tsmom \
            scripts/gmaq-research-tsmom \
            scripts/gmaq-set-readonly-creds
