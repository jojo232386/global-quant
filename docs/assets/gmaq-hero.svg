<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">GMAQ evidence-gated alpha validation</title>
  <desc id="desc">Dark blue project banner showing a data to research to review validation pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#26174a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1440" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1170" cy="120" r="310" fill="url(#glow)"/>
  <circle cx="180" cy="500" r="250" fill="url(#glow)" opacity="0.55"/>

  <g transform="translate(78 74)">
    <rect width="142" height="34" rx="17" fill="#7c3aed" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="71" y="22" text-anchor="middle" fill="#ddd6fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">VALIDATION OS</text>

    <text x="0" y="142" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-4">GMAQ</text>
    <rect x="0" y="166" width="390" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="0" y="222" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="500">Evidence-Gated Alpha Validation</text>
    <text x="0" y="264" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Data lineage · Preregistered research · Fail-closed runtime</text>

    <g transform="translate(0 320)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
      <g>
        <rect width="250" height="54" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55"/>
        <circle cx="28" cy="27" r="7" fill="#38bdf8"/>
        <text x="48" y="33" fill="#e0f2fe" font-size="15" font-weight="700">FROZEN ARCHIVE</text>
      </g>
      <g transform="translate(268 0)">
        <rect width="180" height="54" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.55"/>
        <text x="90" y="33" text-anchor="middle" fill="#ede9fe" font-size="15" font-weight="700">487 TESTS</text>
      </g>
      <g transform="translate(466 0)">
        <rect width="190" height="54" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55"/>
        <text x="95" y="33" text-anchor="middle" fill="#cffafe" font-size="15" font-weight="700">0 REAL ORDERS</text>
      </g>
    </g>
  </g>

  <g transform="translate(850 122)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <path d="M110 65H255M385 65H465M320 130V140M385 205H465" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M520 130V140" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
    <g>
      <rect width="110" height="130" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7"/>
      <circle cx="55" cy="44" r="17" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8"/>
      <text x="55" y="92" text-anchor="middle" fill="#e0f2fe" font-size="15" font-weight="700">DATA</text>
    </g>
    <g transform="translate(255 0)">
      <rect width="130" height="130" rx="20" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.7"/>
      <circle cx="65" cy="44" r="17" fill="#818cf8" fill-opacity="0.18" stroke="#818cf8"/>
      <text x="65" y="92" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700">RESEARCH</text>
    </g>
    <g transform="translate(465 0)">
      <rect width="110" height="130" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.7"/>
      <circle cx="55" cy="44" r="17" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa"/>
      <text x="55" y="92" text-anchor="middle" fill="#ede9fe" font-size="15" font-weight="700">REVIEW</text>
    </g>
    <g transform="translate(255 140)">
      <rect width="130" height="130" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.7"/>
      <circle cx="65" cy="44" r="17" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/>
      <text x="65" y="92" text-anchor="middle" fill="#cffafe" font-size="15" font-weight="700">EVIDENCE</text>
    </g>
    <g transform="translate(465 140)">
      <rect width="110" height="130" rx="20" fill="#2a1522" stroke="#fb7185" stroke-opacity="0.8"/>
      <path d="M43 35L67 59M67 35L43 59" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
      <text x="55" y="92" text-anchor="middle" fill="#ffe4e6" font-size="15" font-weight="700">BLOCK</text>
    </g>
